services:
  icloud-mcp:
    build: .
    container_name: icloud-mcp-server
    # Published on loopback only; put a TLS reverse proxy in front for remote access.
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-8000}:8000"
    environment:
      # Shared secret required on every MCP request; the server refuses to start
      # without one of 32+ characters (openssl rand -hex 32).
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN}
      # The one account this server serves.
      ICLOUD_EMAIL: ${ICLOUD_EMAIL:?set ICLOUD_EMAIL}
      ICLOUD_APP_SPECIFIC_PASSWORD: ${ICLOUD_APP_SPECIFIC_PASSWORD:?set ICLOUD_APP_SPECIFIC_PASSWORD}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      ICLOUD_ENABLED_CATEGORIES: ${ICLOUD_ENABLED_CATEGORIES:-calendar,contacts,email}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    restart: unless-stopped
