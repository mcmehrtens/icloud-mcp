[project]
name = "icloud-mcp"
version = "0.3.0"
description = "Hardened MCP server for iCloud: Calendar (CalDAV), Contacts (CardDAV) and Mail (IMAP). Reads, drafts and calendar edits only: it cannot send mail or delete anything."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mcp", "icloud", "caldav", "carddav", "imap", "claude"]
dependencies = [
    "fastmcp>=4.0,<5",
    "caldav>=2.0",
    "icalendar>=6.0",
    "vobject>=0.9.6",
    "imapclient>=3.0.1",
    "inscriptis>=2.5.0",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "defusedxml>=0.7",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[project.urls]
Repository = "https://github.com/mike-tih/icloud-mcp"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27",
    "ruff>=0.1.0",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Security (bandit) and bugbear checks, enforced in CI.
extend-select = ["S", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
# Pre-existing upstream code: best-effort cleanup in connection teardown, and the
# container's bind address. Scoped per file so new code is still checked.
"src/icloud_mcp/calendar.py" = ["S110"]
"src/icloud_mcp/contacts.py" = ["S112"]
"src/icloud_mcp/mail_utils.py" = ["S110"]
"src/icloud_mcp/config.py" = ["S104"]

[tool.uv]
# Supply-chain cooldown: never resolve a package version published less than
# three days ago (matches Renovate's minimumReleaseAge).
exclude-newer = "3 days"
