name: renovate

# Self-hosted Renovate with a GitHub App token, so its PRs trigger the gating CI
# (PRs made with the default GITHUB_TOKEN would not). Runs hourly so Dependency
# Dashboard and PR checkboxes take effect within the hour and open PRs stay rebased.
# The `schedule` in renovate.json still limits *new* branches to 13:00-14:59 UTC
# daily (Saturdays for the GitHub Actions group and lockfile maintenance), behind the
# 3-day minimumReleaseAge. Minute 23 avoids GitHub's top-of-hour scheduling delays.
# Run it now with `gh workflow run renovate.yml` (add `-f logLevel=debug` to troubleshoot).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        default: info
        options:
          - info
          - debug

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Only what Renovate needs, not the installation's full grant.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # dependency dashboard
          permission-workflows: write # bump SHA-pinned actions in .github/workflows
          permission-checks: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-administration: read # detect branch protection for automerge

      - name: Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
