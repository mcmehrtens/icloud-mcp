name: release

# Daily release from `hardened`, so a day of small changes ships as one version.
# Publishes ghcr.io/<owner>/icloud-mcp:MAJOR, :MAJOR.MINOR, :MAJOR.MINOR.PATCH and
# :sha-<commit>, then tags vMAJOR.MINOR.PATCH. MAJOR.MINOR comes from HARDENED_VERSION
# and PATCH increments automatically.
#
# Skips (and stays green) when HEAD is already released, or when `ci` hasn't passed
# on HEAD's push yet. Runs at 15:00 UTC, two hours after Renovate, so the morning's
# automerges are included.

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release tag (via the API)
      packages: write
      actions: read # look up ci's result for HEAD
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardened
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          released="$(git tag --points-at "$sha" --list 'v*')"
          if [ -n "$released" ]; then
            echo "::notice::HEAD ${sha:0:7} is already released as ${released//$'\n'/, }; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')"
          if [ "$ci" != "completed success" ]; then
            echo "::notice::ci on ${sha:0:7} is '${ci:-not run}'; not releasing today."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(tr -d '[:space:]' < HARDENED_VERSION)"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "HARDENED_VERSION must be MAJOR.MINOR, got '$base'" >&2
            exit 1
          fi
          last="$(git tag --list "v${base}.*" --sort=-v:refname | head -n1)"
          if [ -z "$last" ]; then patch=0; else patch=$(( ${last##*.} + 1 )); fi
          {
            echo "release=true"
            echo "major=${base%%.*}"
            echo "minor=$base"
            echo "version=${base}.${patch}"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        if: steps.plan.outputs.release == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/icloud-mcp
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.plan.outputs.version }}
            type=raw,value=${{ steps.plan.outputs.minor }}
            type=raw,value=${{ steps.plan.outputs.major }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}

      - if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Tag only after the image is published, so every tag has an image.
      - if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${SHA}" >/dev/null
          echo "::notice::Released v${VERSION} (${SHA:0:7})"
